<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart To-Do List - Final Project">
  <title>Smart To-Do List | Final Project</title>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero"></header>
    <section class="card">
      <div class="input-row">
        <input id="taskInput" type="text" maxlength="100" placeholder="Enter a new task..." autocomplete="off">
        <button id="addBtn" class="primary">Add Task</button>
      </div>
      <div class="filters" role="group" aria-label="Task filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
      <div class="task-info">
        <span id="taskCount">0 tasks left</span>
        <button id="clearBtn" class="clear">Clear Completed</button>
      </div>
      <ul id="taskList" aria-live="polite"></ul>
      <div id="emptyMessage" class="empty">
        <div class="empty-icon">✓</div>
        <h2>No tasks yet!</h2>
        <p>Add your first task to get started.</p>
      </div>
    </section>
  </main>
  
  <script src="script.js"></script>
</body>
</html>
